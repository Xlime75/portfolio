<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Asher Daniel Tibayan about projects, collaboration, or opportunities.">
    <link rel="icon" type="image/png" href="Photos/logo.png">
    <title>Asher Daniel Tibayan | Contact</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="main.css">

    <!-- Anime.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
</head>
<body>

    <!-- Navigation Bar (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="Photos/logo.png" alt="Logo" height="40" class="me-2">
                <span class="fw-bold text-dark">ASHER</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav text-uppercase fw-medium">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About Me</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="portfolio.html">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tech-stack.html">Tech Stack</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="contact">
        <h1>Get in Touch</h1>
        <p>I’m happy to hear about project ideas, collaboration, or opportunities. Send me a message and I’ll get back to you as soon as I can.</p>
        
        <div class="contact-form">
            <form id="contactForm" action="https://formspree.io/f/xwplrqjw" method="POST">
                <label for="contactName">Name</label>
                <input id="contactName" type="text" name="name" autocomplete="name" placeholder="Your name" required>
                <label for="contactEmail">Email address</label>
                <input id="contactEmail" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="message" placeholder="How can I help?" required></textarea>
                <button type="submit">Send Message</button>
                <p id="contactStatus" class="contact-status" role="status" aria-live="polite"></p>
            </form>
        </div>

        <div class="contact-info">
            <p>Find me on <a href="https://github.com/Xlime75" target="_blank" rel="noopener noreferrer">GitHub</a></p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Asher Daniel Tibayan. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS Bundle (for navbar toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Link -->
    <script src="script.js"></script>

</body>
</html>
